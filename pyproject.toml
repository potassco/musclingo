[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "musclingo"
authors = [
        { name = "Susana Hahn", email = "susuhahnml@yahoo.com.mx" },
	{ name = "Antonio Ielo", email = "antonio.ielo@unical.it" },
	{ name = "Hannes Weichelt", email = "hweichelt@uni-potsdam.de" },
]
description = "A package to compute MUSes of ASP programs."
requires-python = ">=3.11"
license = { file = "LICENSE" }
dynamic = ["version"]
readme = "README.md"
dependencies = [
    "bidict>=0.23.1",
    "clingo>=5.8.0",
]

[project.urls]
Homepage = "https://github.com/potassco/musclingo.git/"
Documentation = "https://docs.potassco.org/musclingo/"
Repository = "https://github.com/potassco/musclingo"
Issues = "https://github.com/potassco/musclingo/issues"
Changelog = "https://github.com/potassco/musclingo/blob/master/CHANGES.md"

[project.optional-dependencies]
lint = ["ruff"]
typecheck = ["pytest", "ty", "nox"]
test = ["pytest", "pytest-cov", "coverage[toml]"]
doc = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings>=1.0.4",
    "mkdocstrings-python>=2.0",
    "clindocs>=1.5.1",
    "mkdocs-literate-nav",
    "pygments_clingo",
]

dev = ["musclingo[test,typecheck,lint]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "/usr/**",
    "**/site-packages/**",
    "**/node_modules/**",
    "**/typeshed-fallback/**",
]

[tool.ruff.lint]
extend-select = ["I", "E", "F", "B", "C4", "D", "ARG", "SIM", "ANN", "Q"]
ignore = [
    "E741",
    "D200",
    "D203",
    "D212",
    "D413",
    "B023", # broken lint
]

[tool.ruff.lint.per-file-ignores]
"noxfile.py" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.coverage.run]
source = ["musclingo", "tests"]
omit = ["*/musclingo/__main__.py", "*/musclingo/utils/logging.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "raise NotImplementedError",
    "raise TypeError",
    "nocoverage",
    "assert",
    "\\.\\.\\.",
]
